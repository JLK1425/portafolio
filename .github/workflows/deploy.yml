name: Redirigir GitHub Pages a joelabreu.twinmindz.com

# El portafolio se publica en Vercel (https://joelabreu.twinmindz.com).
# Este flujo solo deja en jlk1425.github.io/portafolio una página que redirige allí.
on:
  push:
    branches: [main]
    paths: [".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Crear página de redirección
        run: |
          mkdir -p site
          cat > site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <title>Joel Abreu — Portafolio</title>
            <link rel="canonical" href="https://joelabreu.twinmindz.com/">
            <meta http-equiv="refresh" content="0; url=https://joelabreu.twinmindz.com/">
            <script>location.replace("https://joelabreu.twinmindz.com/" + location.hash);</script>
          </head>
          <body>
            <p>El portafolio se mudó a <a href="https://joelabreu.twinmindz.com/">joelabreu.twinmindz.com</a>.</p>
          </body>
          </html>
          HTML
          cp site/index.html site/404.html
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
